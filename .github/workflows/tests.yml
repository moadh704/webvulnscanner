name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create config from example
        run: cp config.example.py config.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python tests/test_http_utils.py
          python tests/test_ai_provider.py
          python tests/test_ai_provider_none.py
          python tests/test_main_exceptions.py
          python tests/test_e2e_scan.py
